buildscript {
    repositories {
        mavenCentral()
        maven {
            name = "forge"
            url = "https://maven.minecraftforge.net/"
        }
        maven {
            url "https://repo.spongepowered.org/maven"
        }
    }
    dependencies {
        classpath "net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT"
    }
}
apply plugin: "net.minecraftforge.gradle.forge"
apply plugin: "java"


// Project info
version = "1.1.0"
group = "com.icysnex.ghosttap"
archivesBaseName = "GhostTap"

sourceCompatibility = 1.8
targetCompatibility = 1.8


// Forge setup
minecraft {
    version = "1.8.9-11.15.1.2318-1.8.9"
    runDir = "run"
    mappings = "stable_22"
    makeObfSourceJar = false
}

repositories {
    maven {
        url "https://repo.spongepowered.org/maven/"
    }
}

dependencies {
    compile("org.spongepowered:mixin:0.7.11-SNAPSHOT") {
        transitive = false
    }
}

// Keep annotation-processor output separate from processResources, which owns
// (and may clean) build/resources/main. Include it in both the runtime and jar.
def mixinRefmap = file("$buildDir/generated/mixin/mixin.ghosttap.refmap.json")
sourceSets.main.output.dir([builtBy: 'compileJava'], mixinRefmap.parentFile)

compileJava {
    outputs.file mixinRefmap
    doFirst {
        mixinRefmap.parentFile.mkdirs()
    }
}

afterEvaluate {
    tasks.compileJava.dependsOn 'genSrgs'
    tasks.compileJava.options.compilerArgs += [
            "-AreobfSrgFile=${tasks.genSrgs.mcpToSrg.canonicalPath}",
            "-AoutRefMapFile=${mixinRefmap.canonicalPath}"
    ]
}

processResources {
    inputs.property "version", project.version
    inputs.property "mcversion", project.minecraft.version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': project.version, 'mcversion': project.minecraft.version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    doFirst {
        if (!mixinRefmap.isFile() ||
                !new groovy.json.JsonSlurper().parse(mixinRefmap).mappings) {
            throw new GradleException("Missing or empty Mixin refmap. Run clean build with JDK 8.")
        }
    }

    from {
        configurations.compile.findAll { it.name.contains('mixin') }.collect { zipTree(it) }
    }
    exclude 'META-INF/MANIFEST.MF', 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'

    manifest {
        attributes(
                "FMLCorePlugin": "com.icysnex.ghosttap.mixin.MixinLoader",
                "TweakClass": "org.spongepowered.asm.launch.MixinTweaker",
                "MixinConfigs": "mixin.ghosttap.json",
                "ModSide": "CLIENT",
                "ForceLoadAsMod": true,
                "FMLCorePluginContainsFMLMod": true
        )
    }
}

task copyModsToRun(type: Copy) {
    from "build/libs"
    into "run/mods"
    include "*.jar"
}
copyModsToRun.dependsOn build

// Run the built mod in Prism's normal obfuscated Forge environment. This is the
// accurate integration/PvP client: OptiFine and production coremods do not share
// ForgeGradle's deobfuscated runClient naming environment.
def prismRoot = new File(System.getProperty("user.home"), "AppData/Roaming/PrismLauncher")
def prismSourceMinecraft = new File(prismRoot, "instances/1.8.9/minecraft")
def prismDevMinecraft = new File(prismRoot, "instances/1.8.9-dev/minecraft")
def prismDevMods = new File(prismDevMinecraft, "mods")
def prismLauncher = new File(System.getenv("PRISM_LAUNCHER") ?: "G:/Launchers/PrismLauncher/prismlauncher.exe")

task syncPrismDevProfile(type: Copy) {
    description = "Copies the real 1.8.9 profile into the isolated Prism development instance."
    group = "ghosttap development"

    from(prismSourceMinecraft) {
        include "accounts.json", "servers.dat", "usercache.json", "usernamecache.json"
        include "options.txt", "optionsof.txt", "optionsshaders.txt"
        include "ben_playeresp.json", "custom-crosshair-mod_save.txt"
        include "config/**", "OneConfig/**", "patcher/**"
        include "resourcepacks/**", "shaderpacks/**", "server-resource-packs/**", "texturepacks/**"
        include "mods/**"
        exclude "mods/GhostTap*.jar"
        exclude "**/desktop.ini"
    }
    into prismDevMinecraft

    doFirst {
        if (!prismSourceMinecraft.isDirectory()) {
            throw new GradleException("Prism source profile not found: ${prismSourceMinecraft}")
        }
    }
}

task copyModToPrismDev(type: Copy) {
    description = "Builds GhostTap and installs it in the isolated Prism development instance."
    group = "ghosttap development"
    dependsOn build

    from "build/libs"
    into prismDevMods
    include "GhostTap-${project.version}.jar"

    doFirst {
        prismDevMods.mkdirs()
        fileTree(prismDevMods).matching { include "GhostTap*.jar" }.each { oldJar ->
            if (oldJar.name != "GhostTap-${project.version}.jar") {
                def disabledJar = new File(oldJar.parentFile, oldJar.name + ".disabled")
                if (disabledJar.exists()) {
                    disabledJar.delete()
                }
                if (!oldJar.renameTo(disabledJar)) {
                    throw new GradleException("Could not disable stale GhostTap jar: ${oldJar}")
                }
            }
        }
    }
}

task runPvpClient {
    description = "Builds GhostTap and launches the isolated 1.8.9-dev Prism instance."
    group = "ghosttap development"
    dependsOn copyModToPrismDev

    doLast {
        if (!prismLauncher.isFile()) {
            throw new GradleException("Prism Launcher not found: ${prismLauncher}. Set PRISM_LAUNCHER to its executable path.")
        }
        // Ant's spawn mode closes Gradle's redirected stdio handles. A raw
        // ProcessBuilder leaves Prism attached to the daemon and it stalls
        // before launching Minecraft.
        ant.exec(executable: prismLauncher.absolutePath, spawn: true) {
            arg(value: "--launch")
            arg(value: "1.8.9-dev")
        }
    }
}

// The dev client only discovers @Mods (and reads the Mixin manifest) from run/mods,
// so build + drop the jar there before launching. FML remaps it for the dev env.
afterEvaluate {
    tasks.runClient.dependsOn copyModsToRun
}
